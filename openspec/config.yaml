schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Linux is the MVP target platform; designs must keep macOS and Windows support possible
  by isolating OS-specific behavior, but must not spend effort on them before the Linux MVP.
  The project's own code is released under The Unlicense. GPL/LGPL dependencies are acceptable.
  Third-party code is never vendored or redistributed: dependencies are declared in
  pyproject.toml, and native libraries (e.g. libmpv) are documented system dependencies.

rules:
  specs:
    - Place every capability under one of the top-level areas core/, ui/ or platform/
      (e.g. specs/core/library/identity/spec.md)
    - core/ is pure logic and ports; ui/ is views and view-models; platform/ is adapters and OS integration
    - An area's own spec.md (e.g. specs/core/spec.md) holds only cross-cutting requirements
      that apply to every capability beneath it
  tasks:
    - Every implementation task follows Red-Green-Refactor - write the failing test first, then
      the minimal implementation that passes it, then refactor with tests green
    - Each task names the failing test(s) it starts from

operations:
  apply:
    guidance:
      - Before applying, verify the change's full artifact set (proposal, design, specs, tasks.md) is
        committed to git and the change folder has no uncommitted edits; if not, stop and ask for the
        planning commit first (tasks.md gets its own commit if it was not committed with the others)
      - Do all apply work in a git worktree on its own branch, never in the main clone. Create it from
        the commit that holds the planning artifacts with
        `git worktree add .worktrees/<change-name> -b change/<change-name>`, then run `uv sync` inside
        it and make every edit, test run and commit there. If the worktree already exists, continue in
        it. This lets several changes be applied on the same machine at once.
